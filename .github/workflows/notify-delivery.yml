name: Notify chart delivery
on:
  workflow_run:
    workflows: [Service image delivery]
    types: [completed]
permissions:
  contents: read
jobs:
  notify:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'master'
    runs-on: bgs
    container: ubuntu:24.04
    environment: skymist-delivery
    steps:
      - run: apt-get update -qq && apt-get install -y --no-install-recommends ca-certificates curl
      - uses: actions/create-github-app-token@a8d616148505b5069dccd32f177bb87d7f39123b
        id: app
        with:
          app-id: ${{ vars.DELIVERY_APP_ID }}
          private-key: ${{ secrets.DELIVERY_APP_PRIVATE_KEY }}
          owner: SkyMist-Next
          repositories: bgs-chart
          permission-contents: write
      - name: Wake reconciler (periodic reconciliation also recovers missed notifications)
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/SkyMist-Next/bgs-chart/dispatches -d '{"event_type":"application-built"}'
